rocprofiler-sdk:
  counters-schema-version: 1
  counters:
  - name: WaveReuseBarrierWait
    description: Sum across hardware instances of SQ_WAIT_BARRIER
    properties: []
    definitions:
      - architectures: [gfx1151, gfx1152]
        expression: reduce(SQ_WAIT_BARRIER,sum)
  - name: WaveReuseLGKMWait
    description: Sum across hardware instances of SQ_WAIT_CNT_LGKM
    properties: []
    definitions:
      - architectures: [gfx1151, gfx1152]
        expression: reduce(SQ_WAIT_CNT_LGKM,sum)
  - name: WaveReuseVMWait
    description: Sum across hardware instances of SQ_WAIT_CNT_VMVS
    properties: []
    definitions:
      - architectures: [gfx1151, gfx1152]
        expression: reduce(SQ_WAIT_CNT_VMVS,sum)
