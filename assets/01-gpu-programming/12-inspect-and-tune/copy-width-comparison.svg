<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img">
<title>Same four values per thread; change only the copy atom</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Same four values per thread; change only the copy atom</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">One block: 64 threads × 4 float32 values = 256 elements. Follow thread 2.</text>
<text x="32" y="111" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">32-bit atom: one float32 per atom transfer</text>
<rect x="32" y="154" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="42" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<text x="38" y="204" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V0</text>
<rect x="144" y="154" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="154" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">9</text>
<text x="150" y="204" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V1</text>
<rect x="256" y="154" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="266" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">10</text>
<text x="262" y="204" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V2</text>
<rect x="368" y="154" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="378" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">11</text>
<text x="374" y="204" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V3</text>
<rect x="520" y="154" width="94" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="530" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4 B</text>
<rect x="623" y="154" width="94" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="633" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4 B</text>
<rect x="726" y="154" width="94" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="736" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4 B</text>
<rect x="829" y="154" width="94" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="839" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4 B</text>
<text x="520" y="209" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Requested grouping; inspect final instructions.</text>
<text x="32" y="296" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">128-bit atom: four float32 values per atom transfer</text>
<rect x="32" y="339" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="42" y="348" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<text x="38" y="389" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V0</text>
<rect x="144" y="339" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="154" y="348" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">9</text>
<text x="150" y="389" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V1</text>
<rect x="256" y="339" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="266" y="348" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">10</text>
<text x="262" y="389" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V2</text>
<rect x="368" y="339" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="378" y="348" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">11</text>
<text x="374" y="389" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V3</text>
<rect x="520" y="339" width="408" height="44" fill="#ccefe6" stroke="#8294aa"/>
<text x="535" y="348" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">One 16-byte group</text>
<text x="520" y="394" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Requested grouping; inspect final instructions.</text>
<text x="32" y="451" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Cells on the left show offsets 8, 9, 10, 11. Ownership is identical in both variants.</text>
<text x="32" y="494" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Check correctness -&gt; compile and warm up -&gt; time GPU events -&gt; compare medians.</text>
<text x="32" y="537" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Inspect the ISA separately. A wider request does not by itself prove a faster copy.</text>
</svg>
