<text x="32" y="418" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">In block 2, thread 1 owns indices 18 and 19: only its first slot is valid.</text>
<rect x="32" y="477" width="255" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="489" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">global_index &lt; 19?</text>
<text x="44" y="526" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Check before any load</text>
<polyline points="300,520 351,520 343,515 351,520 343,525" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="364" y="477" width="564" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="376" y="489" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Yes: load left + load right -&gt; add -&gt; store</text>
<text x="376" y="526" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">No: skip both input reads and the output write</text>
<text x="32" y="595" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The coordinate view can describe 24 indices; each input allocation has only 19 values.</text>
<text x="32" y="633" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Gray positions have no valid input data. Computing their indices does not read memory.</text>
