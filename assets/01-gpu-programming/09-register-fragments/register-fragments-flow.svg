<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img">
<title>Follow thread 2: load two pairs, add, store one pair</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Follow thread 2: load two pairs, add, store one pair</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Thread 2 owns offsets 4 and 5 in each global view. Boxes below show data values.</text>
<rect x="32" y="127" width="380" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="139" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Global left: [4, 5]</text>
<text x="44" y="176" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">left[i] = i</text>
<polyline points="426,170 497,170 489,165 497,170 489,175" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="512" y="127" width="416" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="524" y="139" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Left fragment: [4, 5]</text>
<text x="524" y="176" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">fx.copy loads the values</text>
<rect x="32" y="248" width="380" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="260" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Global right: [18, 20]</text>
<text x="44" y="297" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">right[i] = 2*i + 10</text>
<polyline points="426,291 497,291 489,286 497,291 489,296" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="512" y="248" width="416" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="524" y="260" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Right fragment: [18, 20]</text>
<text x="524" y="297" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">fx.copy loads the values</text>
<text x="512" y="362" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">Add matching slots: 4+18, 5+20</text>
<rect x="512" y="408" width="416" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="524" y="420" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Reuse left fragment: [22, 25]</text>
<text x="524" y="457" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Per-thread temporary storage</text>
<rect x="32" y="408" width="380" height="87" fill="#e5dcff" stroke="#8294aa"/>
<text x="44" y="420" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Destination offsets 4, 5</text>
<text x="44" y="457" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">fx.copy stores [22, 25]</text>
<text x="32" y="527" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Allocate fragments before loading: make_fragment_like does not initialize data.</text>
<text x="32" y="565" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Flow: global inputs -&gt; load -&gt; per-thread arithmetic -&gt; store -&gt; global output.</text>
<polyline points="500,452 425,452 433,447 425,452 433,457" fill="none" stroke="#14253d" stroke-width="2"/>
</svg>
