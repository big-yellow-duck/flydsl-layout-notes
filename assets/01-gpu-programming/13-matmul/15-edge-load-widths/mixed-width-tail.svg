<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title desc">
<title id="title">15 - Fill a 14-value tail with three copy widths</title>
<desc id="desc">The last A K stage starts at K 32 and the last B N group starts at N 64. Both have fourteen valid BF16 values. The first eight use one 128-bit load. Values eight through eleven use one 64-bit load and values twelve and thirteen use one 32-bit load. Positions fourteen and fifteen stay zero.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">15 - Fill a 14-value tail with three copy widths</text>
<text x="32" y="65" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">M=17, N=78, K=46. The shown window starts at K=32 for A and N=64 for B.</text>
<text x="32" y="112" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">128-bit</text>
