<svg xmlns="http://www.w3.org/2000/svg" width="960" height="810" viewBox="0 0 960 810" role="img">
<title>07b - Derive A and B staging plans independently</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">07b - Derive A and B staging plans independently</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Fixed: 64x64x64 tile, 128 threads, padded A, one LDS tile per operand.</text>
<rect x="32" y="120" width="893" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="132" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Global A/B: row-major buffer views, stride 1024</text>
<text x="44" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">BufferCopy128b -&gt; staging registers -&gt; UniversalCopy128b -&gt; LDS</text>
<rect x="32" y="235" width="893" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="247" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">A plan: contiguous K=64; 64/8=8 chunks per row</text>
<text x="44" y="284" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">128/8=16 thread rows. Thread 17: row 2, K columns 8..15.</text>
<rect x="32" y="350" width="893" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="362" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B plan: contiguous N=64; 64/8=8 chunks per row</text>
<text x="44" y="399" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Same (16,8) geometry here; derived independently for later tuning.</text>
<rect x="32" y="465" width="893" height="87" fill="#e5dcff" stroke="#8294aa"/>
<text x="44" y="477" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Thread 17 repeats at rows 2, 18, 34, 50</text>
<text x="44" y="514" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">32 BF16 values per operand. A LDS stride 72; B LDS stride 64.</text>
<rect x="32" y="580" width="893" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="592" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">LDS -&gt; K=16 operand registers -&gt; WMMA -&gt; FP32 accumulator</text>
<text x="44" y="629" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Same buffer transfers and prefetch schedule as stage 07a.</text>
<text x="32" y="705" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Block (x,y)=(1,2), K tile 2, thread 17: first staging chunk</text>
<text x="32" y="748" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">A[130,136..143] -&gt; padded LDS; B[130,72..79] -&gt; packed LDS</text>
</svg>
