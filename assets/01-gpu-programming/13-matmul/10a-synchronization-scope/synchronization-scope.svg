<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">10a - Order LDS for the threads that share it</title>
<desc id="desc">Independent single-wave groups use disjoint LDS regions and subgroup execution scope. Two waves sharing a tile need workgroup execution scope. Both handoffs order LDS memory; global split-K atomics keep agent scope.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">10a - Order LDS for the threads that share it</text>
<text x="32" y="74" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Memory address space: LDS. Execution scope: threads exchanging that data.</text>
<text x="32" y="125" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Wide tile: independent wave groups</text>
<rect x="32" y="174" width="430" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wave 0: 32 threads</text>
<text x="44" y="223" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Only wave 0 writes and reads its tile</text>
<polyline points="242,275 242,313 235,305 242,313 249,305" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="32" y="330" width="430" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="342" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Private group 0 LDS region</text>
<text x="44" y="379" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Subgroup rendezvous + LDS ordering</text>
<rect x="492" y="174" width="430" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="504" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wave 1: 32 threads</text>
<text x="504" y="223" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Only wave 1 writes and reads its tile</text>
<polyline points="702,275 702,313 695,305 702,313 709,305" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="492" y="330" width="430" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="504" y="342" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Private group 1 LDS region</text>
<text x="504" y="379" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Subgroup rendezvous + LDS ordering</text>
<text x="32" y="448" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Narrow tile: two cooperating waves share one A/B tile</text>
<rect x="32" y="496" width="300" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="508" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wave 0 + wave 1</text>
<text x="44" y="545" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">64 participating threads</text>
<polyline points="344,540 398,540 390,535 398,540 390,545" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="414" y="496" width="511" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="426" y="508" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Shared A/B LDS tile</text>
<text x="426" y="545" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Workgroup rendezvous + LDS ordering</text>
<text x="32" y="617" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Reader handoff: finish old reads. Publication handoff: expose the new tile.</text>
<rect x="32" y="665" width="893" height="87" fill="#e2e8f0" stroke="#8294aa"/>
<text x="44" y="677" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Split-K workspace is global memory, shared across blocks</text>
<text x="44" y="714" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Its arrival counter retains agent-scope acquire/release atomics.</text>
</svg>
