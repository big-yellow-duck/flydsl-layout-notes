<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
<title id="title">09 - Group M before advancing K splits</title>
<desc id="desc">A four by two output tile grid with group_m two and split_k two visits adjacent M rows at the same split, then advances K split, column, and M group.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">09 - Group M before advancing K splits</text>
<text x="32" y="67" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Output grid: 4 rows x 2 columns; group_m=2; split_k=2.</text>
<text x="32" y="107" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Fastest to slowest: row within group -&gt; K split -&gt; column -&gt; M group.</text>
<rect x="32" y="158" width="213" height="86" fill="#dcecff" stroke="#8294aa"/>
<text x="42" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">ID 0: row 0, col 0</text>
<text x="42" y="204" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">K split 0; tile ID 0</text>
<rect x="262" y="158" width="213" height="86" fill="#dcecff" stroke="#8294aa"/>
