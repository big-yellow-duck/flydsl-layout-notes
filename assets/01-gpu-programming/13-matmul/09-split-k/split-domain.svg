<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc">
<title id="title">09 - Give a skinny output more blocks along K</title>
<desc id="desc">Sixteen output tiles become sixty-four blocks with four disjoint K ranges per tile. Blocks 8 through 11 share output tile 2.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">09 - Give a skinny output more blocks along K</text>
<text x="32" y="65" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">M=16, N=1024, K=8192; block 16 x 64 x 64; split_k=4.</text>
<text x="32" y="106" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">The 1 x 16 logical output grid has only 16 tiles. Launch 64 blocks.</text>
<rect x="32" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="38" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<rect x="88" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="94" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="144" y="152" width="52" height="62" fill="#ffedbe" stroke="#8294aa"/>
<text x="150" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<rect x="200" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="206" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<rect x="256" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="262" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="312" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="318" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">5</text>
<rect x="368" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="374" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">6</text>
<rect x="424" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="430" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<rect x="480" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="486" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<rect x="536" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="542" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">9</text>
<rect x="592" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="598" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">10</text>
<rect x="648" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="654" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">11</text>
<rect x="704" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="710" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">12</text>
<rect x="760" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="766" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">13</text>
<rect x="816" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="822" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">14</text>
<rect x="872" y="152" width="52" height="62" fill="#dcecff" stroke="#8294aa"/>
<text x="878" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">15</text>
<text x="32" y="239" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Cells label output tile IDs. Trace tile 2: output rows 0..15, columns 128..191.</text>
<text x="32" y="292" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Physical ID = tile_id * 4 + split_id. All four blocks target the same tile.</text>
<rect x="32" y="342" width="213" height="112" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="357" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">block 8, split 0</text>
<text x="44" y="394" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">K [0,2048)</text>
<text x="44" y="426" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">32 local K tiles</text>
<rect x="262" y="342" width="213" height="112" fill="#ccefe6" stroke="#8294aa"/>
<text x="274" y="357" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">block 9, split 1</text>
<text x="274" y="394" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">K [2048,4096)</text>
<text x="274" y="426" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">32 local K tiles</text>
<rect x="492" y="342" width="213" height="112" fill="#ffedbe" stroke="#8294aa"/>
<text x="504" y="357" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">block 10, split 2</text>
<text x="504" y="394" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">K [4096,6144)</text>
<text x="504" y="426" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">32 local K tiles</text>
<rect x="722" y="342" width="213" height="112" fill="#e5dcff" stroke="#8294aa"/>
<text x="734" y="357" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">block 11, split 3</text>
<text x="734" y="394" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">K [6144,8192)</text>
<text x="734" y="426" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">32 local K tiles</text>
<text x="32" y="500" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Trace block 10: split_id=2, initial_tile_k=64, first matrix K index=4096.</text>
<rect x="32" y="552" width="893" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="564" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Within each split: retain stage 08&#x27;s prefetch pipeline</text>
<text x="44" y="601" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">next globals -&gt; private staging; current LDS -&gt; K=16 WMMA -&gt; FP32 partials</text>
<text x="32" y="675" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Each block owns a disjoint K range and has its own single LDS tile per operand.</text>
<text x="32" y="717" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The output tile repeats across splits; output values are combined before BF16 storage.</text>
<text x="32" y="766" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Output tile ID, split ID, K-tile index, and matrix K index are different coordinates.</text>
</svg>
