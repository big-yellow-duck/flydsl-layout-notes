<text x="508" y="500" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Only C[16,64] is stored here.</text>
<text x="508" y="545" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">A[16,32] = -2; B[32,64] = -1.</text>
<text x="508" y="587" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Final K stage contributes 2.</text>
<text x="32" y="689" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">The full K reduction gives C[16,64] = 1 for the lesson&#x27;s trace inputs.</text>
<text x="32" y="738" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Predicates follow each copy plan; LDS tiles and WMMA fragments stay full-sized.</text>
