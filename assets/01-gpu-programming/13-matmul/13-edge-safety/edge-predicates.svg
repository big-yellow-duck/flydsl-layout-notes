<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<title id="title">13 - Full WMMA tiles, exact matrix bounds</title>
<desc id="desc">For M=17, N=65, K=33 and a 16 by 64 by 32 tile, output block row one and column one begins at row sixteen and column sixty-four. Its final K stage begins at thirty-two. Only A row sixteen K thirty-two, B K thirty-two column sixty-four, and C row sixteen column sixty-four are valid in the shown corner. All other shown A and B coordinates become zero; invalid C stores are skipped.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">13 - Full WMMA tiles, exact matrix bounds</text>
<text x="32" y="68" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">M=17, N=65, K=33; tile 16 x 64 x 32; final K stage starts at 32.</text>
<text x="32" y="112" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Zoom: first four positions in each edge window. Cells show coordinates.</text>
