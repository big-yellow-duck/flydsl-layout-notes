<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">13 - A valid byte address can name an invalid matrix coordinate</title>
<desc id="desc">A row-major 3 by 5 BF16 matrix has strides five and one. The invalid coordinate row zero column five maps to element offset five, which belongs to valid coordinate row one column zero. A whole-buffer descriptor accepts the offset, so a per-axis predicate must reject column five. Likewise, for K=33 the final eight-position A chunk at K thirty-two contains one valid element. The lesson selects scalar copies when the row extent is odd.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">13 - A valid byte address can name an invalid matrix coordinate</text>
<text x="32" y="67" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Small address example: A has shape (3,5), strides (5,1), and 15 BF16 values.</text>
