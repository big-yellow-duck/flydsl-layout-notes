<text x="635" y="248" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">offset 14</text>
<text x="32" y="337" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Invalid A[0,5]: element offset = 0*5+5 = 5; byte displacement = 10.</text>
<text x="32" y="384" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">That address holds A[1,0]. A 30-byte buffer bound allows the access.</text>
<rect x="32" y="451" width="420" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Coordinate predicate: column &lt; 5</text>
<text x="44" y="500" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">5 &lt; 5 is false: do not load.</text>
<rect x="490" y="451" width="435" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="502" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Vector predicate: column + width &lt;= 5</text>
<text x="502" y="500" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The complete copy atom must fit the row.</text>
</svg>
