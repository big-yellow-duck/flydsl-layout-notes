<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img">
<title>02 - Reuse one B value across four output rows</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">02 - Reuse one B value across four output rows</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">64 threads per block; thread 1 owns rows 0,1,2,3 at column 1.</text>
<rect x="32" y="120" width="260" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="132" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Load B[k,1] once</text>
<text x="44" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">One FP32 register value</text>
<rect x="32" y="235" width="255" height="45" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="245" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Load A[0,k]</text>
<polyline points="297,257 350,257 342,252 350,257 342,262" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="365" y="235" width="550" height="45" fill="#ffedbe" stroke="#8294aa"/>
<text x="380" y="245" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">acc[0] += A[0,k] * B[k,1]</text>
<rect x="32" y="296" width="255" height="45" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="306" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Load A[1,k]</text>
<polyline points="297,318 350,318 342,313 350,318 342,323" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="365" y="296" width="550" height="45" fill="#ffedbe" stroke="#8294aa"/>
<text x="380" y="306" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">acc[1] += A[1,k] * B[k,1]</text>
<rect x="32" y="357" width="255" height="45" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="367" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Load A[2,k]</text>
<polyline points="297,379 350,379 342,374 350,379 342,384" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="365" y="357" width="550" height="45" fill="#ffedbe" stroke="#8294aa"/>
<text x="380" y="367" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">acc[2] += A[2,k] * B[k,1]</text>
<rect x="32" y="418" width="255" height="45" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="428" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Load A[3,k]</text>
<polyline points="297,440 350,440 342,435 350,440 342,445" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="365" y="418" width="550" height="45" fill="#ffedbe" stroke="#8294aa"/>
<text x="380" y="428" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">acc[3] += A[3,k] * B[k,1]</text>
<text x="32" y="505" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Four FP32 accumulators survive across K. Convert each final result to BF16.</text>
</svg>
