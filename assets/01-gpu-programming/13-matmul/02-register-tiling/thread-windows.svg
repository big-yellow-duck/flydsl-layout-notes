<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img">
<title>02 - A thread selects a 4 x 1 output window with native division</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">02 - A thread selects a 4 x 1 output window with native division</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Block (1,2), thread 17: thread_coordinate=(1,1) in a (4,16) thread layout.</text>
<text x="32" y="112" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">out_thread_tiled_view = flat_divide(out_block_view, (4,1))</text>
<text x="32" y="154" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Shape (4,1,4,16): (local row, local column, row group, column group)</text>
<text x="32" y="199" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">slice(..., (None,None,1,1)) -&gt; out_thread_view: shape (4,1)</text>
<text x="32" y="244" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Crop of output block: local rows 4..7, columns 0..7. Labels are local coordinates.</text>
