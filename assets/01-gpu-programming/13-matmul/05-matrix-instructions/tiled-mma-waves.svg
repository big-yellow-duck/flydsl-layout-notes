<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img">
<title>05 - Four wave32 groups cover one 32 x 32 output tile</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">05 - Four wave32 groups cover one 32 x 32 output tile</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Atom: 16x16x16. Atom layout: (2,2,1):(1,2,0). No permutation.</text>
<text x="32" y="110" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Wave ID = wave_m + 2*wave_n; each wave has 32 lanes.</text>
<rect x="32" y="165" width="410" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="177" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wave 0: threads 0..31</text>
<text x="44" y="214" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Rows 0..15, cols 0..15</text>
<rect x="32" y="310" width="410" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="322" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wave 1: threads 32..63</text>
<text x="44" y="359" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Rows 16..31, cols 0..15</text>
<rect x="515" y="165" width="410" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="527" y="177" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wave 2: threads 64..95</text>
<text x="527" y="214" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Rows 0..15, cols 16..31</text>
<rect x="515" y="310" width="410" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="527" y="322" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wave 3: threads 96..127</text>
<text x="527" y="359" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Rows 16..31, cols 16..31</text>
<text x="32" y="461" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Coordinates are local output rows/columns in the 32 x 32 block.</text>
<rect x="32" y="510" width="893" height="82" fill="#ffedbe" stroke="#8294aa"/>
<text x="48" y="522" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">BLOCK_K = 32: each wave updates its tile for K=0..15, then K=16..31.</text>
<text x="48" y="558" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The K repetition adds operand values; it does not add wave groups.</text>
<text x="32" y="632" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">128 threads x eight FP32 accumulator slots = 1024 unique output positions.</text>
</svg>
