<text x="32" y="523" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Shown: output rows 0..3, columns 0..7. Labels identify owning LANES.</text>
<text x="32" y="562" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Lane 1 owns rows 0,2,...,14 at column 1: eight FP32 accumulator slots.</text>
<text x="32" y="603" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Replicated inputs are intentional; every output still has a unique writer.</text>
