<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img">
<title>05 - A wave32 owns one 16 x 16 WMMA result</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">05 - A wave32 owns one 16 x 16 WMMA result</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">gfx11 BF16 WMMA: 32 lanes cooperate on a 16 x 16 x 16 multiplication.</text>
<rect x="32" y="115" width="410" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="127" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">A operand view: (M,K)</text>
<text x="44" y="164" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">LDS strides (16,1)</text>
<rect x="515" y="115" width="410" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="527" y="127" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B operand view: (N,K)</text>
<text x="527" y="164" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">LDS strides (1,16)</text>
<text x="32" y="227" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Both lane halves load replicated A/B fragments: 16 BF16 values per lane.</text>
<text x="32" y="270" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">C ownership: column = lane % 16; row = 2 * slot + lane // 16</text>
<text x="32" y="322" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">r0</text>
<rect x="85" y="311" width="97" height="43" fill="#e5dcff" stroke="#8294aa"/>
<text x="95" y="320" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">L0</text>
<rect x="185" y="311" width="97" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="195" y="320" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">L1</text>
