<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">12 - Choose the memory path for each operand</title>
<desc id="desc">A 32 by 64 by 64 block keeps A in private WMMA-compatible register fragments. B uses coalesced 128-bit global loads, a private staging fragment, packed LDS, then WMMA-compatible LDS reads. Only B uses the 8192-byte shared tile. All compute waves perform their own loading and WMMA.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">12 - Choose the memory path for each operand</text>
<text x="32" y="68" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Walkthrough: M=32, N=1024, K=8192; block 32 x 64 x 64; two wave32 groups.</text>
<text x="32" y="118" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">A: contiguous K values already fit each WMMA thread&#x27;s operand</text>
<rect x="32" y="172" width="200" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="184" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">GLOBAL A</text>
<text x="44" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Row-major; K stride 1</text>
<rect x="286" y="172" width="260" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="298" y="184" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">NEXT A REGISTERS</text>
<text x="298" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">128-bit reads; MMA plan</text>
<rect x="602" y="172" width="323" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="614" y="184" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">CURRENT A REGISTERS</text>
<text x="614" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Select one K=16 fragment</text>
<polyline points="240,215 276,215 268,210 276,215 268,220" fill="none" stroke="#14253d" stroke-width="2"/>
<polyline points="554,215 592,215 584,210 592,215 584,220" fill="none" stroke="#14253d" stroke-width="2"/>
<text x="32" y="291" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">A values stay private. Other N waves and duplicate lanes can read the same input.</text>
<text x="32" y="350" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">B: keep global loads contiguous along N, then redistribute through LDS</text>
<rect x="32" y="403" width="190" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="415" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">GLOBAL B</text>
<text x="44" y="452" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">N stride 1</text>
<rect x="263" y="403" width="194" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="275" y="415" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">COPY REGISTERS</text>
<text x="275" y="452" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">128-bit B loads</text>
<rect x="498" y="403" width="190" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="510" y="415" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">PACKED LDS</text>
<text x="510" y="452" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">8192 bytes; B only</text>
<rect x="729" y="403" width="196" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="741" y="415" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">WMMA B</text>
<text x="741" y="452" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">K is strided in LDS</text>
<polyline points="230,447 253,447 245,442 253,447 245,452" fill="none" stroke="#14253d" stroke-width="2"/>
<polyline points="465,447 488,447 480,442 488,447 480,452" fill="none" stroke="#14253d" stroke-width="2"/>
<polyline points="696,447 719,447 711,442 719,447 711,452" fill="none" stroke="#14253d" stroke-width="2"/>
<text x="32" y="525" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Different copy owners stage B; the WMMA plan selects each compute thread&#x27;s values.</text>
<rect x="32" y="580" width="893" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="592" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Same matrix instruction, FP32 accumulation, and single-kernel split-K finalizer</text>
<text x="44" y="629" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">All waves load and compute. Workgroup barriers protect the shared B tile.</text>
<text x="32" y="702" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">The wide workload can select A-through-LDS when its measured time is lower.</text>
</svg>
