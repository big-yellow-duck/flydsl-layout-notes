<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc">
<title id="title">12 - Follow thread 3 through the two operand paths</title>
<desc id="desc">For block zero and inner K slice one, thread three reads A row three at K sixteen through twenty-three. Global element offsets are 24592 through 24599, and trace values are zero, one, two, minus two, minus one, zero, one, two. Its B staging copy loads columns twenty-four through thirty-one of global row zero. Its WMMA B reads instead use LDS offsets 1027, 1091, 1155 and onward, separated by sixty-four BF16 elements.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">12 - Follow thread 3 through the two operand paths</text>
<text x="32" y="67" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Physical block 0, split 0, local K tile 0, inner_k=1; compute thread 3.</text>
<text x="32" y="117" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">A row 3, K=16..23: offset = 3*8192 + K (BF16 elements)</text>
