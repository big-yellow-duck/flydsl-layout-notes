<text x="828" y="229" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">value 2</text>
<text x="32" y="300" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">One 128-bit copy reads these eight BF16 values. The next copy reads K=24..31.</text>
<text x="32" y="340" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">First element: 24592 elements * 2 bytes = 49184-byte displacement from A&#x27;s base.</text>
