<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">WMMA lanes 1 and 17 gather a column of B</title>
<desc id="desc">Both lanes gather column 1 from row-major B. The first K stage reads offsets 1 through 106 in steps of seven. The second reads 113 and adds zeros.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">WMMA lanes 1 and 17 gather a column of B</text>
<text x="32" y="72" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B has 17 rows and 7 columns. Each cell shows a flat B offset.</text>
<text x="32" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Stage 0</text>
<text x="32" y="226" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Stage 1</text>
<rect x="210" y="104" width="139" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="220" y="113" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<text x="214" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=0</text>
<rect x="387" y="104" width="139" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="397" y="113" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<text x="391" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=1</text>
<rect x="564" y="104" width="139" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="574" y="113" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">15</text>
<text x="568" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=2</text>
<rect x="741" y="104" width="139" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="751" y="113" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">106</text>
<text x="745" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=15</text>
<rect x="210" y="201" width="139" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="220" y="210" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">113</text>
<text x="214" y="267" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=16</text>
<rect x="387" y="201" width="139" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="397" y="210" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">zero</text>
<text x="391" y="267" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=17</text>
<rect x="564" y="201" width="139" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="574" y="210" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">zero</text>
<text x="568" y="267" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=18</text>
<rect x="741" y="201" width="139" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="751" y="210" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">zero</text>
<text x="745" y="267" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">K=31</text>
<text x="32" y="324" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Registers hold each lane&#x27;s K values in WMMA input order.</text>
</svg>
