<svg xmlns="http://www.w3.org/2000/svg" width="960" height="910" viewBox="0 0 960 910" role="img" aria-labelledby="title desc">
<title id="title">10 - Select a physical block, then its 2D wave tiles</title>
<desc id="desc">M64 N256 K8192, per-wave M16 N64 K16. A 2 by 2 wave-group grid gives each physical block a 32 by 128 output region and four disjoint A/B LDS pairs. Wave columns vary first. Group M two orders physical block rows before K splits and physical columns.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">10 - Select a physical block, then its 2D wave tiles</text>
<text x="32" y="72" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">M=64, N=256, K=8192; each wave computes 16 x 64, with K chunks of 16.</text>
<rect x="32" y="118" width="893" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="130" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Physical block 0: C rows 0..31, columns 0..127</text>
<text x="44" y="167" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Group shape (2,2): 4 wave32 tiles, 128 threads, 11264 LDS bytes.</text>
<rect x="32" y="248" width="433" height="147" fill="#ccefe6" stroke="#8294aa"/>
<text x="46" y="260" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Wave 0: (group_row,group_col)=(0,0)</text>
<text x="46" y="296" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">C rows 0..15, cols 0..63</text>
<text x="46" y="331" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Threads 0..31; local IDs 0..31</text>
<text x="46" y="365" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Private A/B LDS: 768 + 2048 bytes</text>
<rect x="492" y="248" width="433" height="147" fill="#ffedbe" stroke="#8294aa"/>
<text x="506" y="260" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Wave 1: (group_row,group_col)=(0,1)</text>
<text x="506" y="296" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">C rows 0..15, cols 64..127</text>
<text x="506" y="331" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Threads 32..63; local IDs 0..31</text>
<text x="506" y="365" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Private A/B LDS: 768 + 2048 bytes</text>
<rect x="32" y="422" width="433" height="147" fill="#dcecff" stroke="#8294aa"/>
<text x="46" y="434" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Wave 2: (group_row,group_col)=(1,0)</text>
<text x="46" y="470" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">C rows 16..31, cols 0..63</text>
<text x="46" y="505" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Threads 64..95; local IDs 0..31</text>
<text x="46" y="539" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Private A/B LDS: 768 + 2048 bytes</text>
<rect x="492" y="422" width="433" height="147" fill="#e5dcff" stroke="#8294aa"/>
<text x="506" y="434" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Wave 3: (group_row,group_col)=(1,1)</text>
<text x="506" y="470" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">C rows 16..31, cols 64..127</text>
<text x="506" y="505" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Threads 96..127; local IDs 0..31</text>
<text x="506" y="539" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Private A/B LDS: 768 + 2048 bytes</text>
<text x="32" y="607" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Waves 0/1 repeat A; waves 0/2 repeat B. Every copy remains private.</text>
<rect x="32" y="652" width="893" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="664" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">traversal_group_m=2 orders physical block rows with split_k=2</text>
<text x="44" y="701" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">First four block IDs at physical column 0: row 0/split 0, row 1/split 0,</text>
<text x="44" y="747" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">then row 0/split 1, row 1/split 1. Each block&#x27;s four waves use one split.</text>
<text x="32" y="807" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">out_block_view: 32 x 128  -&gt;  divide 16 x 64  -&gt;  slice (group_row,group_col)</text>
<text x="32" y="853" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Physical block rows and wave rows are different axes; LDS uses both wave axes.</text>
</svg>
