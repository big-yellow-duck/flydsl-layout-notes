<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img">
<title>03 - Stage a K tile once, then share it within the block</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">03 - Stage a K tile once, then share it within the block</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Each K step covers 16 columns of A and 16 rows of B.</text>
<rect x="32" y="119" width="410" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="131" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">A block: 16 x 16 BF16</text>
<text x="44" y="168" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">512 bytes in global memory</text>
<rect x="515" y="119" width="410" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="527" y="131" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B block: 16 x 16 BF16</text>
<text x="527" y="168" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">512 bytes in global memory</text>
<text x="195" y="228" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">stage to LDS</text>
<text x="678" y="228" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">stage to LDS</text>
<rect x="32" y="270" width="893" height="65" fill="#ffedbe" stroke="#8294aa"/>
<text x="48" y="282" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">LDS: 1,024 bytes total. Thread t loads offsets t, t+64, t+128, t+192.</text>
<rect x="32" y="365" width="893" height="65" fill="#e5dcff" stroke="#8294aa"/>
<text x="48" y="379" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Barrier -&gt; consume 16 K values -&gt; barrier -&gt; overwrite for next K tile</text>
<text x="32" y="466" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Thread 1 still updates C[0..3,1]; ownership is unchanged from lesson 02.</text>
<text x="32" y="511" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The second barrier protects readers from early writes by another wave.</text>
</svg>
