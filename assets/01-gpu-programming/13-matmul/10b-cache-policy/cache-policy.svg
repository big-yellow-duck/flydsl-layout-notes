<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
<title id="title">10b - Change B&#x27;s load policy while keeping its addresses</title>
<desc id="desc">Modifier zero and modifier two both read eight adjacent BF16 values per 128-bit instruction. Policy two emits SLC on gfx11. A one-wave 16 by 64 B tile with K sixteen gives each thread thirty-two BF16 staging values, or four complete vectors. Hardware caches remain distinct from allocated LDS.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">10b - Change B&#x27;s load policy while keeping its addresses</text>
<text x="32" y="72" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Wide case: B tile 16 x 64; 32 staging threads; 32 BF16 values per thread.</text>
<text x="32" y="123" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Thread 3&#x27;s first vector: B row 0, columns 24..31</text>
<rect x="32" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="42" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">24</text>
<text x="43" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">0</text>
<rect x="144" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="154" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">25</text>
<text x="155" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">1</text>
<rect x="256" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="266" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">26</text>
<text x="267" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">2</text>
<rect x="368" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="378" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">27</text>
<text x="379" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">3</text>
<rect x="480" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="490" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">28</text>
<text x="491" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">-3</text>
<rect x="592" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="602" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">29</text>
<text x="603" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">-2</text>
<rect x="704" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="714" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">30</text>
<text x="715" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">-1</text>
<rect x="816" y="174" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="826" y="183" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">31</text>
<text x="827" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">0</text>
<text x="32" y="278" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Top: global element offsets. Below: actual values B[i]=(i%7)-3.</text>
<rect x="32" y="331" width="335" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="343" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">BufferCopy128b(0)</text>
<text x="44" y="380" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">8 BF16 values = 128 bits</text>
<polyline points="379,375 425,375 417,370 425,375 417,380" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="441" y="331" width="484" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="453" y="343" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Same source and staging ownership</text>
<text x="453" y="380" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Ordinary policy</text>
<rect x="32" y="440" width="335" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="452" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">BufferCopy128b(2)</text>
<text x="44" y="489" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">8 BF16 values = 128 bits</text>
<polyline points="379,484 425,484 417,479 425,484 417,489" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="441" y="440" width="484" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="453" y="452" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Same source and staging ownership</text>
<text x="453" y="489" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">gfx11 SLC policy bit set</text>
<text x="32" y="568" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Four complete vectors fill the same 32-value B staging fragment.</text>
<rect x="32" y="617" width="428" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="629" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Hardware-managed caches</text>
<text x="44" y="666" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The hint influences global reads.</text>
<rect x="494" y="617" width="431" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="506" y="629" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Application-managed LDS</text>
<text x="506" y="666" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The tile and its barriers stay the same.</text>
<text x="32" y="739" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Measure policy 0 versus 2 with tile geometry and the rolled K loop fixed.</text>
</svg>
