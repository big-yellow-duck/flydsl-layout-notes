<rect x="668" y="290" width="45" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="678" y="299" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">11</text>
