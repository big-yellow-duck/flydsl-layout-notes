<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img">
<title>04 - Copy eight BF16 values per thread with UniversalCopy128b</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">04 - Copy eight BF16 values per thread with UniversalCopy128b</text>
<text x="32" y="70" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Copy tile: 32 x 64. Full input tile: 64 x 64. Block: 256 threads.</text>
<text x="32" y="112" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Thread 9 = copy row 1, chunk 1. Cells show LOCAL COLUMN COORDINATES.</text>
