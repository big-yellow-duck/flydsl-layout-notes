<rect x="812" y="290" width="45" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="822" y="299" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">14</text>
<rect x="860" y="290" width="45" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="870" y="299" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">15</text>
<text x="140" y="342" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Columns 16..63 omitted. Other threads copy those chunks.</text>
<text x="32" y="390" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">One gold chunk = 8 BF16 x 2 bytes = 16 bytes = 128 bits.</text>
<text x="32" y="434" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Global row-major -&gt; registers -&gt; row-major LDS for both A and B</text>
<text x="32" y="478" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Local (1,8): global relative offset 1032; LDS relative offset 72.</text>
<text x="32" y="522" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">256 threads x 2 row repetitions x 8 values = 4096 elements per input.</text>
<text x="32" y="566" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Compute ownership is separate: thread 9 owns output rows 0..3, cols 36..39.</text>
<text x="32" y="610" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Compute: four strided A rows + four contiguous B columns; reuse each four times.</text>
</svg>
