<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img">
<title>Steps 2-3 - Four modes become one selected two-dimensional view</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Steps 2-3 - Four modes become one selected two-dimensional view</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">out_tiled_view = flat_divide(out_global_view, (16,16))</text>
<rect x="32" y="123" width="207" height="107" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="136" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">local row</text>
<text x="44" y="179" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">extent 16</text>
<rect x="32" y="270" width="207" height="73" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="283" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">None</text>
<text x="44" y="316" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="15" fill="#14253d">keep this mode</text>
<rect x="262" y="123" width="207" height="107" fill="#dcecff" stroke="#8294aa"/>
<text x="274" y="136" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">local column</text>
<text x="274" y="179" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">extent 16</text>
<rect x="262" y="270" width="207" height="73" fill="#dcecff" stroke="#8294aa"/>
<text x="274" y="283" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">None</text>
<text x="274" y="316" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="15" fill="#14253d">keep this mode</text>
<rect x="492" y="123" width="207" height="107" fill="#ffedbe" stroke="#8294aa"/>
<text x="504" y="136" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">tile row</text>
<text x="504" y="179" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">extent 64</text>
<rect x="492" y="270" width="207" height="73" fill="#ffedbe" stroke="#8294aa"/>
<text x="504" y="283" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">2</text>
<text x="504" y="316" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="15" fill="#14253d">fix this tile</text>
<rect x="722" y="123" width="207" height="107" fill="#ffedbe" stroke="#8294aa"/>
<text x="734" y="136" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">tile column</text>
<text x="734" y="179" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">extent 64</text>
<rect x="722" y="270" width="207" height="73" fill="#ffedbe" stroke="#8294aa"/>
<text x="734" y="283" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">1</text>
<text x="734" y="316" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="15" fill="#14253d">fix this tile</text>
<text x="32" y="382" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">out_block_view = slice(out_tiled_view, (None, None, 2, 1))</text>
<rect x="32" y="438" width="893" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="450" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Result: shape (16,16), strides (1024,1)</text>
<text x="44" y="487" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Two None entries keep local coordinates; fixed tile coordinates select the base.</text>
<text x="32" y="550" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">A smaller view still uses the original matrix row stride. No data has been copied.</text>
</svg>
