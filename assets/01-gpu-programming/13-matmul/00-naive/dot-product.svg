<text x="32" y="326" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">First 16 pairs contribute 4. The full dot product uses all 1,024 pairs.</text>
<text x="32" y="373" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Block (0,0), thread 1 owns C[0,1]. Output offset = 0 * 1024 + 1 = 1.</text>
<text x="32" y="418" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">BF16 loads -&gt; FP32 multiplication and accumulation -&gt; BF16 store</text>
<text x="32" y="460" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Gold marks k=1: (-1) * 0 = 0. This is a tile zoom of the 1024 x 1024 workload.</text>
