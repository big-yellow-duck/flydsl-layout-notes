<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img">
<title>00 - Native views select a block, then one thread&#x27;s dot product</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">00 - Native views select a block, then one thread&#x27;s dot product</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Fixed workload: A, B, C are 1024 x 1024. Labels below are view SHAPES.</text>
<rect x="32" y="112" width="410" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="124" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">left_global_view</text>
<text x="44" y="161" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">(1024,1024), strides (1024,1)</text>
<rect x="515" y="112" width="410" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="527" y="124" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">right_global_view</text>
<text x="527" y="161" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">(1024,1024), strides (1024,1)</text>
<text x="32" y="225" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">flat_divide(left, (16,K))</text>
<text x="515" y="225" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">flat_divide(right, (K,16))</text>
<rect x="32" y="268" width="410" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="280" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">left_tiled_view</text>
<text x="44" y="317" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">(16,1024,64,1)</text>
<rect x="515" y="268" width="410" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="527" y="280" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">right_tiled_view</text>
<text x="527" y="317" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">(1024,16,1,64)</text>
<text x="32" y="380" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Select tile row 2, column 0</text>
<text x="515" y="380" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Select tile row 0, column 1</text>
<rect x="32" y="422" width="410" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="434" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">left_block_view: (16,1024)</text>
<text x="44" y="471" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Global A rows 32..47; all K</text>
<rect x="515" y="422" width="410" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="527" y="434" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">right_block_view: (1024,16)</text>
<text x="527" y="471" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">All K; global B columns 16..31</text>
<text x="32" y="537" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Thread 17 -&gt; local coordinate (1,1) in the 16 x 16 thread layout.</text>
<text x="32" y="580" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">left_row: shape 1024, stride 1. right_column: shape 1024, stride 1024.</text>
<rect x="32" y="625" width="893" height="75" fill="#ffedbe" stroke="#8294aa"/>
<text x="48" y="638" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Reduce A[33,k] * B[k,17] for k=0..1023, then store C[33,17].</text>
<text x="48" y="670" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">out_block_view[1,1] carries the selected block base; output offset = 33809.</text>
</svg>
