<text x="32" y="469" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8 FP32 accumulators / thread</text>
<text x="32" y="513" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">1024 output blocks for 1024x1024</text>
<text x="32" y="557" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">4608 LDS bytes / block</text>
<text x="420" y="711" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">64 FP32 accumulators / thread; 128 output blocks</text>
<text x="420" y="748" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">14336 LDS bytes / block; repeated operand reuse</text>
<rect x="32" y="802" width="893" height="83" fill="#ffedbe" stroke="#8294aa"/>
<text x="48" y="816" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Wave 0 owns alternating tile stripes, rather than a contiguous 64x32 window.</text>
<text x="48" y="851" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Natural MMA footprint stays 32x32x16; larger views add static repetitions.</text>
