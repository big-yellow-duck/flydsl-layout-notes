<svg xmlns="http://www.w3.org/2000/svg" width="960" height="930" viewBox="0 0 960 930" role="img">
<title>08 - Larger register tiles repeat the same four-wave MMA</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">08 - Larger register tiles repeat the same four-wave MMA</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Cells are 16x16 WMMA output tiles. Labels identify owning WAVE groups.</text>
<text x="32" y="110" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Both use atom layout (2,2,1):(1,2,0), 128 threads, and a 32-wide K stage.</text>
<text x="32" y="161" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">32x32: one atom tile / wave</text>
<text x="420" y="161" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">128x64: eight atom tiles / wave</text>
