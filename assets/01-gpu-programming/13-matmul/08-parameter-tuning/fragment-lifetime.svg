<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img">
<title>08 - Stage 32 K values, consume 16 at a time</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">08 - Stage 32 K values, consume 16 at a time</text>
<text x="32" y="70" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Selected block: 128x128x32. Example: stage 0, K=0..31.</text>
<rect x="32" y="130" width="430" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="142" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">LDS: K=0..15</text>
<text x="44" y="179" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">A: 128x16; B: 16x128</text>
<rect x="496" y="130" width="430" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="508" y="142" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">LDS: K=16..31</text>
<text x="508" y="179" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">A: 128x16; B: 16x128</text>
<text x="32" y="244" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">rk=0: copy operands, then WMMA</text>
<text x="496" y="244" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">rk=1: reuse operands, then WMMA</text>
<polyline points="247,280 247,329 242,321 247,329 252,321" fill="none" stroke="#14253d" stroke-width="2"/>
<polyline points="711,280 711,329 706,321 711,329 716,321" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="180" y="350" width="600" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="192" y="362" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Same 128x128 FP32 accumulator</text>
<text x="192" y="399" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">128 values / thread stay live across both updates</text>
<text x="32" y="470" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">The prefetched next global tile uses separate staging registers.</text>
<text x="32" y="508" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Logical view sizes are shown; register fragments follow native MMA ownership.</text>
</svg>
