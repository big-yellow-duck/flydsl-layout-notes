<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img">
<title>06 - Change A&#x27;s LDS placement; keep logical coordinates</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">06 - Change A&#x27;s LDS placement; keep logical coordinates</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">A tile: 64x64 BF16. Trace fixed k=2 across rows r=0..7.</text>
<text x="32" y="108" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">e = element offset; bank = (2*e // 4) % 32 for 32 four-byte banks.</text>
<rect x="32" y="170" width="285" height="425" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="184" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Packed: stride 64</text>
<text x="44" y="225" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Row   element e   bank</text>
<text x="44" y="274" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r0         2         1</text>
<text x="44" y="313" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r1        66         1</text>
<text x="44" y="352" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r2       130         1</text>
<text x="44" y="391" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r3       194         1</text>
<text x="44" y="430" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r4       258         1</text>
<text x="44" y="469" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r5       322         1</text>
<text x="44" y="508" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r6       386         1</text>
<text x="44" y="547" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r7       450         1</text>
<rect x="336" y="170" width="285" height="425" fill="#ffedbe" stroke="#8294aa"/>
<text x="348" y="184" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Swizzle&lt;3,3,3&gt;</text>
<text x="348" y="225" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Row   element e   bank</text>
<text x="348" y="274" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r0         2         1</text>
<text x="348" y="313" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r1        74         5</text>
<text x="348" y="352" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r2       146         9</text>
<text x="348" y="391" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r3       218        13</text>
<text x="348" y="430" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r4       290        17</text>
<text x="348" y="469" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r5       362        21</text>
<text x="348" y="508" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r6       434        25</text>
<text x="348" y="547" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r7       506        29</text>
<rect x="640" y="170" width="285" height="425" fill="#ccefe6" stroke="#8294aa"/>
<text x="652" y="184" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Padded: stride 72</text>
<text x="652" y="225" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Row   element e   bank</text>
<text x="652" y="274" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r0         2         1</text>
<text x="652" y="313" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r1        74         5</text>
<text x="652" y="352" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r2       146         9</text>
<text x="652" y="391" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r3       218        13</text>
<text x="652" y="430" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r4       290        17</text>
<text x="652" y="469" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r5       362        21</text>
<text x="652" y="508" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r6       434        25</text>
<text x="652" y="547" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">r7       506        29</text>
<text x="32" y="635" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Row 2, k=2: packed e=130 -&gt; XOR 16 -&gt; swizzled e=146 -&gt; byte 292 -&gt; bank 9.</text>
<text x="32" y="681" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The swizzle preserves low three bits: eight-BF16 staging chunks stay contiguous.</text>
<rect x="32" y="727" width="893" height="75" fill="#e5dcff" stroke="#8294aa"/>
<text x="48" y="739" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">This is an address sketch, not a measured conflict rate for a GPU instruction.</text>
<text x="48" y="773" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Use the complete kernel&#x27;s LDS counters, generated ISA, and separate timing.</text>
</svg>
