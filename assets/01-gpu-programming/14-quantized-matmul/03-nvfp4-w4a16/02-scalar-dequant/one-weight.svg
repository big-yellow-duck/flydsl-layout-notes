<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">One GPU thread decodes B[16, 1]</title>
<desc id="desc">Thread 17 of block 2 reads a packed nibble and two scale values.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">One GPU thread decodes B[16, 1]</text>
<text x="32" y="72" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">Block 2, thread 17 owns flat index 145.</text>
<rect x="32" y="125" width="276" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="137" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Packed byte 72</text>
<text x="44" y="174" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">0x29 gives high nibble 0x2</text>
<rect x="341" y="125" width="270" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="353" y="137" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Block scale [1, 1]</text>
<text x="353" y="174" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">E4M3 byte 0x3c gives 1.5</text>
<rect x="644" y="125" width="281" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="656" y="137" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Tensor scale [0]</text>
<text x="656" y="174" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">FP32 value 0.5</text>
<rect x="32" y="261" width="893" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="273" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Store B[16, 1] = 1 × 1.5 × 0.5 = 0.75</text>
<text x="44" y="310" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Round to BF16 for stage 15.</text>
</svg>
