<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">A K-block boundary changes the block scale</title>
<desc id="desc">Two equal FP4 codes in column 1 decode to 0.5 and 0.75.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">A K-block boundary changes the block scale</text>
<text x="32" y="73" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">Column 1 of B has tensor scale 0.5 in both blocks.</text>
<rect x="32" y="127" width="433" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="139" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B[15, 1] uses scale row 0</text>
<text x="44" y="176" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Code 0x2 = 1. Scale 0x38 = 1.</text>
<rect x="493" y="127" width="433" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="505" y="139" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B[16, 1] uses scale row 1</text>
<text x="505" y="176" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Code 0x2 = 1. Scale 0x3c = 1.5.</text>
<text x="46" y="250" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">BF16 result   1 × 1 × 0.5 = 0.5</text>
<text x="507" y="250" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">BF16 result   1 × 1.5 × 0.5 = 0.75</text>
</svg>
