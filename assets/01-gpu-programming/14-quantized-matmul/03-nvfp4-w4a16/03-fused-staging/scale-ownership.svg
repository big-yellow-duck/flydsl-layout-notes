<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
<title id="title">A 32-row stage spans two NVFP4 blocks</title>
<desc id="desc">Lane 0 owns columns 0 through 7 and four K slots per block.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">A 32-row stage spans two NVFP4 blocks</text>
<text x="32" y="71" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">Lane 0 owns B columns 0 through 7.</text>
<text x="32" y="134" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Scale word from row 0</text>
<rect x="305" y="126" width="131" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="315" y="135" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<rect x="448" y="126" width="131" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="458" y="135" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="591" y="126" width="131" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="601" y="135" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<rect x="734" y="126" width="131" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="744" y="135" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">12</text>
<text x="306" y="178" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">All four K slots are valid.</text>
<text x="32" y="234" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Scale word from row 1</text>
<rect x="305" y="226" width="131" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="315" y="235" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">16</text>
<rect x="448" y="226" width="131" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="458" y="235" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">20</text>
<rect x="591" y="226" width="131" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="601" y="235" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">24</text>
<rect x="734" y="226" width="131" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="744" y="235" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">28</text>
<text x="306" y="278" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">K = 17. Slots 20, 24, and 28 publish zeros.</text>
<text x="32" y="346" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">The cells show K coordinates, and each scale word holds eight column scales.</text>
</svg>
