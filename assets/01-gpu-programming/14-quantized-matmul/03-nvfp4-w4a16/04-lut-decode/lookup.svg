<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Two register lookups expand eight E2M1 magnitudes</title>
<desc id="desc">Four packed bytes give two sets of selectors and FP32 magnitude bytes.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Two register lookups expand eight E2M1 magnitudes</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Packed B values for row 16, columns 0 through 7.</text>
<text x="32" y="116" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Packed bytes</text>
<rect x="290" y="108" width="137" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="300" y="117" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x29</text>
<rect x="440" y="108" width="137" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="450" y="117" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x43</text>
<rect x="590" y="108" width="137" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="600" y="117" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x65</text>
<rect x="740" y="108" width="137" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="750" y="117" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xf7</text>
<text x="32" y="168" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Even selectors</text>
<rect x="290" y="160" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="300" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="440" y="160" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="450" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<rect x="590" y="160" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="600" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">5</text>
<rect x="740" y="160" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="750" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="32" y="220" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Even table bytes</text>
<rect x="290" y="212" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="300" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xfc</text>
<rect x="440" y="212" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="450" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xff</text>
<rect x="590" y="212" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="600" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x01</text>
<rect x="740" y="212" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="750" y="221" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x03</text>
<text x="32" y="272" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Odd selectors</text>
<rect x="290" y="264" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="300" y="273" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<rect x="440" y="264" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="450" y="273" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="590" y="264" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="600" y="273" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">6</text>
<rect x="740" y="264" width="137" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="750" y="273" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="32" y="324" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Odd table bytes</text>
<rect x="290" y="316" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="300" y="325" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xfe</text>
<rect x="440" y="316" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="450" y="325" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x00</text>
<rect x="590" y="316" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="600" y="325" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x02</text>
<rect x="740" y="316" width="137" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="750" y="325" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x03</text>
<text x="32" y="378" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Rebuild signed FP32 weights, then apply the block scale and tensor scale.</text>
</svg>
