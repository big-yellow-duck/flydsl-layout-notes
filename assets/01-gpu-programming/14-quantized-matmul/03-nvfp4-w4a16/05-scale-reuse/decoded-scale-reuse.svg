<svg xmlns="http://www.w3.org/2000/svg" width="960" height="419" viewBox="0 0 960 419" role="img" aria-labelledby="title desc">
<title id="title">Decode one scale word and publish its owned K slots</title>
<desc id="desc">Lane 0 decodes eight FP32 scales for each scale slot. Slot 0 supplies K rows 0, 4, 8, 12. Slot 1 supplies row 16 and three padded slots.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Decode one scale word and publish its owned K slots</text>
<text x="32" y="69" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Lane 0, B columns 0 through 7. Cells show K coordinates.</text>
<rect x="32" y="123" width="350" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="135" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Decode scale slot 0</text>
<text x="44" y="172" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Keep eight FP32 scales in registers.</text>
<polyline points="388,165 427,165 419,160 427,165 419,170" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="447" y="146" width="103" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="457" y="155" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<rect x="564" y="146" width="103" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="574" y="155" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="681" y="146" width="103" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="691" y="155" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<rect x="798" y="146" width="103" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="808" y="155" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">12</text>
<rect x="32" y="234" width="350" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="246" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Decode scale slot 1</text>
<text x="44" y="283" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Keep eight FP32 scales in registers.</text>
<polyline points="388,276 427,276 419,271 427,276 419,281" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="447" y="257" width="103" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="457" y="266" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">16</text>
<rect x="564" y="257" width="103" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="574" y="266" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">20</text>
<rect x="681" y="257" width="103" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="691" y="266" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">24</text>
<rect x="798" y="257" width="103" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="808" y="266" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">28</text>
<text x="32" y="359" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">For K = 17, rows 20, 24, and 28 publish zeros.</text>
</svg>
