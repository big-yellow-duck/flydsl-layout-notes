<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img" aria-labelledby="title desc">
<title id="title">14.2 - Two scale lookups for one MXFP8 product</title>
<desc id="desc">K coordinate 44 lies in the second MX block of A and B. A row 16 uses scale 119 and B column 76 uses scale 120. The decoded BF16 pair contributes 0.765625 to C[16,76].</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">14.2 - Two scale lookups for one MXFP8 product</text>
<text x="32" y="69" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Follow K = 44 in the dot product for C[16, 76].</text>
<text x="32" y="109" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Both operands select K block 44 // 32 = 1.</text>
<rect x="32" y="158" width="232" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">A[16, 44]</text>
<text x="44" y="207" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Byte 780 = 0x7e</text>
<text x="280" y="185" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">+</text>
<rect x="315" y="158" width="252" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="327" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">A scale[16, 1]</text>
<text x="327" y="207" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Byte 33 = 119</text>
<polyline points="581,202 622,202 614,197 622,202 614,207" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="639" y="158" width="286" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="651" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">BF16 staging value</text>
<text x="651" y="207" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">448 × 2⁻⁸ = 1.75</text>
<rect x="32" y="279" width="232" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="291" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B[44, 76]</text>
<text x="44" y="328" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Byte 3464 = 0x66</text>
<text x="280" y="306" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">+</text>
<rect x="315" y="279" width="252" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="327" y="291" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B scale[1, 76]</text>
<text x="327" y="328" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Byte 153 = 120</text>
<polyline points="581,323 622,323 614,318 622,323 614,328" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="639" y="279" width="286" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="651" y="291" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">BF16 staging value</text>
<text x="651" y="328" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">56 × 2⁻⁷ = 0.4375</text>
<text x="32" y="423" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">This K coordinate contributes 1.75 × 0.4375 = 0.765625.</text>
<text x="32" y="462" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">WMMA accumulates the 46 terms in FP32. BF16 C[16, 76] is 2.40625.</text>
<text x="32" y="506" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">A&#x27;s scale is shared along a row. B&#x27;s scale is shared down a column.</text>
</svg>
