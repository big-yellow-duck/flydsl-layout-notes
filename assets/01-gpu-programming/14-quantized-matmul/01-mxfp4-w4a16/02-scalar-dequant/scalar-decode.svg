<svg xmlns="http://www.w3.org/2000/svg" width="960" height="403" viewBox="0 0 960 403" role="img" aria-labelledby="title desc">
<title id="title">One thread decodes B[32, 1]</title>
<desc id="desc">Block 1, thread 33 owns weight index 97. The high nibble of packed byte 48 gives code 0x1. Scale byte 126 at (1,1) multiplies the code&#x27;s value 0.5 by 0.5. The thread writes 0.25 to B at (32,1).</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">One thread decodes B[32, 1]</text>
<text x="32" y="70" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Block 1, thread 33 owns flat index 1 × 64 + 33 = 97.</text>
<rect x="32" y="123" width="425" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="135" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Read packed byte 48</text>
<text x="44" y="172" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">0x10 gives high nibble 0x1 (value 0.5)</text>
<rect x="499" y="123" width="426" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="511" y="135" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Read scales[1, 1]</text>
<text x="511" y="172" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">126 gives scale 2^(126 − 127) = 0.5</text>
<polyline points="244,213 244,236 237,228 244,236 251,228" fill="none" stroke="#14253d" stroke-width="2"/>
<polyline points="712,213 712,236 705,228 712,236 719,228" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="32" y="240" width="893" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="44" y="252" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Write B[32, 1] = 0.5 × 0.5 = 0.25</text>
<text x="44" y="289" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The decoded value is stored in BF16.</text>
<text x="32" y="357" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Stage 15 reads the decoded (33, 3) matrix as its B operand.</text>
</svg>
