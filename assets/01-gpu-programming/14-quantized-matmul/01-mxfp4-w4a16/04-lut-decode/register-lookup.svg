<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc">
<title id="title">Two register lookups decode the magnitudes of eight weights</title>
<desc id="desc">Packed bytes 0x91, 0xb2, 0xd4, and 0xf6 supply even selectors 1, 2, 4, 6 and odd selectors 1, 3, 5, 7. The register table returns doubled magnitudes 1, 2, 4, 8 and 1, 3, 6, 12 respectively.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Two register lookups decode the magnitudes of eight weights</text>
<text x="32" y="68" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Register table [0, 1, 2, 3 | 4, 6, 8, 12] stores twice each magnitude.</text>
<text x="32" y="130" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Packed bytes</text>
<rect x="286" y="121" width="143" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="296" y="130" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x91</text>
<rect x="442" y="121" width="143" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="452" y="130" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xb2</text>
<rect x="598" y="121" width="143" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="608" y="130" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xd4</text>
<rect x="754" y="121" width="143" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="764" y="130" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xf6</text>
<text x="32" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Even selectors</text>
<rect x="286" y="177" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="296" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="442" y="177" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="452" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<rect x="598" y="177" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="608" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="754" y="177" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="764" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">6</text>
<text x="32" y="242" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Even table bytes</text>
<rect x="286" y="233" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="296" y="242" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="442" y="233" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="452" y="242" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<rect x="598" y="233" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="608" y="242" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="754" y="233" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="764" y="242" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<text x="32" y="298" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Odd selectors</text>
<rect x="286" y="289" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="296" y="298" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="442" y="289" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="452" y="298" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<rect x="598" y="289" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="608" y="298" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">5</text>
<rect x="754" y="289" width="143" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="764" y="298" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="32" y="354" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Odd table bytes</text>
<rect x="286" y="345" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="296" y="354" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="442" y="345" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="452" y="354" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<rect x="598" y="345" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="608" y="354" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">6</text>
<rect x="754" y="345" width="143" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="764" y="354" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">12</text>
<text x="32" y="415" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Interleave even and odd results, then apply each original sign and scale.</text>
</svg>
