<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">One scale per column in each K block</title>
<desc id="desc">B has 33 rows and 3 columns. Each group of up to 32 K rows has one scale per column. In column 1, scale bytes 127 and 126 decode to multipliers 1 and 0.5.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">One scale per column in each K block</text>
<text x="32" y="70" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">B has shape (33, 3). The cells show E8M0 bytes and their multipliers.</text>
<text x="334" y="124" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Column 0</text>
<text x="528" y="124" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Column 1</text>
<text x="722" y="124" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Column 2</text>
<text x="32" y="187" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">K rows 0–31</text>
<rect x="310" y="180" width="175" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="320" y="189" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">128 to 2</text>
<rect x="504" y="180" width="175" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="514" y="189" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">127 to 1</text>
<rect x="698" y="180" width="175" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="708" y="189" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">126 to 0.5</text>
<text x="32" y="251" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">K row 32</text>
<rect x="310" y="244" width="175" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="320" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">129 to 4</text>
<rect x="504" y="244" width="175" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="514" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">126 to 0.5</text>
<rect x="698" y="244" width="175" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="708" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">125 to 0.25</text>
<text x="32" y="319" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">In column 1, code 0x1 (0.5) gives 0.5 in block 0 and 0.25 in block 1.</text>
</svg>
