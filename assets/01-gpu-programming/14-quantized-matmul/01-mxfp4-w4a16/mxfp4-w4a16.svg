<svg xmlns="http://www.w3.org/2000/svg" width="960" height="634" viewBox="0 0 960 634" role="img" aria-labelledby="title desc">
<title id="title">14.1 - Decode five packed B values at the physical edge</title>
<desc id="desc">The last row of B starts the N=72 suffix on the high nibble of byte 1768. Three packed bytes and five block-scale bytes decode into BF16 for the LDS tile.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">14.1 - Decode five packed B values at the physical edge</text>
<text x="32" y="68" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Follow B[45, 72:77] in the 17 x 77 x 46 example.</text>
<rect x="32" y="122" width="331" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="44" y="134" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Packed bytes 1768–1770</text>
<text x="44" y="171" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">0xe8, 0x68, 0x52</text>
<rect x="378" y="122" width="547" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="390" y="134" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Load 2 bytes, then 1 byte</text>
<text x="390" y="171" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Shift right by 4 bits to start at nibble 3537.</text>
<polyline points="365,166 376,166 368,161 376,166 368,171" fill="none" stroke="#14253d" stroke-width="2"/>
<text x="32" y="232" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">K block 1 supplies five scale bytes at offsets 149–153.</text>
<text x="32" y="269" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Load four scale bytes and one scale byte.</text>
<text x="32" y="320" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">N column</text>
<rect x="256" y="312" width="121" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="266" y="321" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">72</text>
<rect x="388" y="312" width="121" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="398" y="321" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">73</text>
<rect x="520" y="312" width="121" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="530" y="321" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">74</text>
<rect x="652" y="312" width="121" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="662" y="321" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">75</text>
<rect x="784" y="312" width="121" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="794" y="321" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">76</text>
<text x="32" y="372" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">E2M1 code</text>
<rect x="256" y="364" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="266" y="373" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0xe</text>
<rect x="388" y="364" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="398" y="373" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x8</text>
<rect x="520" y="364" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="530" y="373" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x6</text>
<rect x="652" y="364" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="662" y="373" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x2</text>
<rect x="784" y="364" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="794" y="373" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0x5</text>
<text x="32" y="424" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">E8M0 byte</text>
<rect x="256" y="416" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="266" y="425" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">125</text>
<rect x="388" y="416" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="398" y="425" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">125</text>
<rect x="520" y="416" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="530" y="425" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">125</text>
<rect x="652" y="416" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="662" y="425" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">126</text>
<rect x="784" y="416" width="121" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="794" y="425" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">126</text>
<text x="32" y="476" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Decoded BF16</text>
<rect x="256" y="468" width="121" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="266" y="477" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">−1.0</text>
<rect x="388" y="468" width="121" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="398" y="477" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">−0.0</text>
<rect x="520" y="468" width="121" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="530" y="477" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1.0</text>
<rect x="652" y="468" width="121" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="662" y="477" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0.5</text>
<rect x="784" y="468" width="121" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="794" y="477" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1.5</text>
<text x="32" y="547" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Write the decoded vector into B&#x27;s LDS tile. The C store stops at N = 77.</text>
<text x="32" y="583" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">C[16, 76] accumulates across all 46 K values and rounds to 2.28125.</text>
</svg>
