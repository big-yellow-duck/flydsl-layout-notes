<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img">
<title>One ownership plan connects two separate allocations</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">One ownership plan connects two separate allocations</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Four threads; two neighbor values per thread. Color identifies the owner.</text>
<text x="32" y="108" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">SOURCE: source[i] = 3*i + 7</text>
<rect x="32" y="149" width="102" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="42" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="36" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=0 / T0</text>
<rect x="144" y="149" width="102" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="154" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">10</text>
<text x="148" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=1 / T0</text>
<rect x="256" y="149" width="102" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="266" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">13</text>
<text x="260" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=2 / T1</text>
<rect x="368" y="149" width="102" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="378" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">16</text>
<text x="372" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=3 / T1</text>
<rect x="480" y="149" width="102" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="490" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">19</text>
<text x="484" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=4 / T2</text>
<rect x="592" y="149" width="102" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="602" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">22</text>
<text x="596" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=5 / T2</text>
<rect x="704" y="149" width="102" height="43" fill="#e5dcff" stroke="#8294aa"/>
<text x="714" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">25</text>
<text x="708" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=6 / T3</text>
<rect x="816" y="149" width="102" height="43" fill="#e5dcff" stroke="#8294aa"/>
<text x="826" y="158" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">28</text>
<text x="820" y="202" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=7 / T3</text>
<text x="32" y="369" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">DESTINATION: after fx.copy</text>
<rect x="32" y="410" width="102" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="42" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="36" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=0 / T0</text>
<rect x="144" y="410" width="102" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="154" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">10</text>
<text x="148" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=1 / T0</text>
<rect x="256" y="410" width="102" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="266" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">13</text>
<text x="260" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=2 / T1</text>
<rect x="368" y="410" width="102" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="378" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">16</text>
<text x="372" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=3 / T1</text>
<rect x="480" y="410" width="102" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="490" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">19</text>
<text x="484" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=4 / T2</text>
<rect x="592" y="410" width="102" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="602" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">22</text>
<text x="596" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=5 / T2</text>
<rect x="704" y="410" width="102" height="43" fill="#e5dcff" stroke="#8294aa"/>
<text x="714" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">25</text>
<text x="708" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=6 / T3</text>
<rect x="816" y="410" width="102" height="43" fill="#e5dcff" stroke="#8294aa"/>
<text x="826" y="419" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">28</text>
<text x="820" y="463" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">i=7 / T3</text>
<rect x="32" y="251" width="315" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="263" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">partition_S / partition_D</text>
<text x="44" y="300" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Describe this thread&#x27;s views</text>
<polyline points="361,293 419,293 411,288 419,293 411,298" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="432" y="251" width="496" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="444" y="263" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">fx.copy moves the values</text>
<text x="444" y="300" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Thread 2 copies 19 and 22 at offsets 4 and 5</text>
<text x="32" y="513" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Numbers in cells are DATA VALUES. i labels the offset in each allocation.</text>
<text x="32" y="556" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Partitioning chooses positions; the copy reads source and writes destination.</text>
</svg>
