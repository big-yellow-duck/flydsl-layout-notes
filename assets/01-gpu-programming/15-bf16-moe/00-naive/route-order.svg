<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img">
<title>A route identifies a token and a top-k slot</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">A route identifies a token and a top-k slot</text>
<text x="33" y="78" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Token</text>
<text x="165" y="78" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Slot 0 (expert, route)</text>
<text x="432" y="78" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Slot 1 (expert, route)</text>
<rect x="33" y="124" width="83" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="43" y="133" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<rect x="165" y="124" width="247" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="175" y="133" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Expert 0 / route 0</text>
<rect x="432" y="124" width="247" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="442" y="133" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Expert 1 / route 1</text>
<rect x="33" y="178" width="83" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="43" y="187" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="165" y="178" width="247" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="175" y="187" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Expert 1 / route 2</text>
<rect x="432" y="178" width="247" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="442" y="187" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Expert 0 / route 3</text>
<rect x="33" y="232" width="83" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="43" y="241" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<rect x="165" y="232" width="247" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="175" y="241" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Expert 0 / route 4</text>
<rect x="432" y="232" width="247" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="442" y="241" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Expert 2 / route 5</text>
<rect x="726" y="124" width="203" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="738" y="136" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Route 3</text>
<text x="738" y="173" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Token 1, slot 1</text>
<text x="33" y="304" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Multiply each down projection by its route weight before summing by token.</text>
</svg>
