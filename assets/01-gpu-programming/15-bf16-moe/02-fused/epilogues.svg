<svg xmlns="http://www.w3.org/2000/svg" width="960" height="325" viewBox="0 0 960 325" role="img">
<title>Keep the gate and up accumulators in the projection</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Keep the gate and up accumulators in the projection</text>
<rect x="33" y="77" width="263" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="45" y="89" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Gate/up WMMA</text>
<text x="45" y="126" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">FP32 gate and up</text>
<polyline points="305,120 337,120 329,115 337,120 329,125" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="347" y="77" width="263" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="359" y="89" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">SwiGLU epilogue</text>
<text x="359" y="126" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">One BF16 activation</text>
<polyline points="619,120 651,120 643,115 651,120 643,125" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="661" y="77" width="266" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="673" y="89" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Down WMMA</text>
<text x="673" y="126" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">FP32 expert result</text>
<rect x="33" y="184" width="263" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="45" y="196" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Weighted down</text>
<text x="45" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Apply the route weight</text>
<polyline points="305,227 337,227 329,222 337,227 329,232" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="347" y="184" width="263" height="87" fill="#e5dcff" stroke="#8294aa"/>
<text x="359" y="196" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Token reduction</text>
<text x="359" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Sum FP32 contributions</text>
<polyline points="619,227 651,227 643,222 651,227 643,232" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="661" y="184" width="266" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="673" y="196" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Output</text>
<text x="673" y="233" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Round once to BF16</text>
<text x="33" y="290" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Read left to right across the top, then continue on the bottom row.</text>
</svg>
