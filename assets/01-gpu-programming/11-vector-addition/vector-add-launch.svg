<svg xmlns="http://www.w3.org/2000/svg" width="960" height="595" viewBox="0 0 960 595" role="img">
<title>A complete launch: 9 elements need two blocks</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">A complete launch: 9 elements need two blocks</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Each block: 4 threads × 2 values = 8 candidate positions. grid = (count + 7) // 8.</text>
<text x="32" y="127" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Block 0</text>
<rect x="157" y="120" width="87" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="167" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<text x="159" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T0 / V0</text>
<rect x="253" y="120" width="87" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="263" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<text x="255" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T0 / V1</text>
<rect x="349" y="120" width="87" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="359" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<text x="351" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T1 / V0</text>
<rect x="445" y="120" width="87" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="455" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<text x="447" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T1 / V1</text>
<rect x="541" y="120" width="87" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="551" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<text x="543" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T2 / V0</text>
<rect x="637" y="120" width="87" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="647" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">5</text>
<text x="639" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T2 / V1</text>
<rect x="733" y="120" width="87" height="43" fill="#e5dcff" stroke="#8294aa"/>
<text x="743" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">6</text>
<text x="735" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T3 / V0</text>
<rect x="829" y="120" width="87" height="43" fill="#e5dcff" stroke="#8294aa"/>
<text x="839" y="129" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="831" y="170" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T3 / V1</text>
<text x="32" y="251" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Block 1</text>
<rect x="157" y="244" width="87" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="167" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">8</text>
<text x="159" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T0 / V0</text>
<rect x="253" y="244" width="87" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="263" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">9</text>
<text x="255" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T0 / V1</text>
<rect x="349" y="244" width="87" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="359" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">10</text>
<text x="351" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T1 / V0</text>
<rect x="445" y="244" width="87" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="455" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">11</text>
<text x="447" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T1 / V1</text>
<rect x="541" y="244" width="87" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="551" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">12</text>
<text x="543" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T2 / V0</text>
<rect x="637" y="244" width="87" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="647" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">13</text>
<text x="639" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T2 / V1</text>
<rect x="733" y="244" width="87" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="743" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">14</text>
<text x="735" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T3 / V0</text>
<rect x="829" y="244" width="87" height="43" fill="#e2e8f0" stroke="#8294aa"/>
<text x="839" y="253" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">15</text>
<text x="831" y="294" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T3 / V1</text>
<text x="32" y="357" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Cells show global indices. In block 1, only T0 / V0 (index 8) passes the check.</text>
<rect x="32" y="412" width="264" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="424" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Choose global index</text>
<text x="44" y="461" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">8*block + 2*thread + slot</text>
<polyline points="308,455 347,455 339,450 347,455 339,460" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="360" y="412" width="210" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="372" y="424" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Check index &lt; 9</text>
<text x="372" y="461" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Per value slot</text>
<polyline points="582,455 621,455 613,450 621,455 613,460" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="634" y="412" width="294" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="646" y="424" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Read, add, write</text>
<text x="646" y="461" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">out[i] = left[i] + right[i]</text>
<text x="32" y="536" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Every valid index has one owner. Skipped positions perform no input or output access.</text>
</svg>
