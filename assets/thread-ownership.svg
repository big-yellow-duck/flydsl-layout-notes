<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
<title>A thread-value layout assigns ownership</title><desc>Four toy threads × two values cover an eight-element block tile. Colors show the owner.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="22" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">A thread-value layout assigns ownership</text>
<text x="32" y="62" fill="#52657a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge">Four toy threads × two values cover an eight-element block tile. Colors show the owner.</text>
<text x="40" y="112" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" dominant-baseline="text-before-edge">Blocked: index = 2*thread + value</text>
<rect x="40" y="158" width="99" height="55" rx="6" fill="#dcecff" stroke="#c9d5e3" stroke-width="1"/>
<text x="82.54296875" y="173.5" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">0</text>
<text x="61.7734375" y="225" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge">T0, V0</text>
