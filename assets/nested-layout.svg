<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img">
<title>Nested parentheses preserve hierarchy</title><desc>L = ((2,2),3):((1,4),8)    •    L((a,b),c) = a + 4b + 8c</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="22" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">Nested parentheses preserve hierarchy</text>
<text x="32" y="62" fill="#52657a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge">L = ((2,2),3):((1,4),8)    •    L((a,b),c) = a + 4b + 8c</text>
<rect x="40" y="115" width="400" height="70" rx="6" fill="#dcecff" stroke="#c9d5e3" stroke-width="1"/>
<text x="85.25" y="130" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" dominant-baseline="text-before-edge">mode 0: (a,b), shape (2,2)</text>
<rect x="520" y="115" width="390" height="70" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="603.11328125" y="130" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" dominant-baseline="text-before-edge">mode 1: c, shape 3</text>
<line x1="140" y1="185" x2="140" y2="222" stroke="#52657a" stroke-width="2"/>
<line x1="340" y1="185" x2="340" y2="222" stroke="#52657a" stroke-width="2"/>
<rect x="60" y="222" width="160" height="70" rx="6" fill="white" stroke="#c9d5e3" stroke-width="1"/>
<text x="89.25390625" y="238" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge">a: stride 1</text>
<rect x="260" y="222" width="160" height="70" rx="6" fill="white" stroke="#c9d5e3" stroke-width="1"/>
<text x="289.03515625" y="238" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge">b: stride 4</text>
<line x1="715" y1="185" x2="715" y2="222" stroke="#52657a" stroke-width="2"/>
<rect x="625" y="222" width="180" height="70" rx="6" fill="white" stroke="#c9d5e3" stroke-width="1"/>
<text x="664.8828125" y="238" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge">c: stride 8</text>
<text x="40" y="335" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge">Offsets grouped by c; inner order is a first, then b:</text>
<rect x="40" y="378" width="280" height="68" rx="6" fill="#dcecff" stroke="#c9d5e3" stroke-width="1"/>
<text x="158.72265625" y="388" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge">c = 0</text>
<text x="130.328125" y="414" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">0, 1, 4, 5</text>
<rect x="345" y="378" width="280" height="68" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="463.72265625" y="388" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge">c = 1</text>
<text x="421.4140625" y="414" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">8, 9, 12, 13</text>
<rect x="650" y="378" width="280" height="68" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="768.72265625" y="388" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" dominant-baseline="text-before-edge">c = 2</text>
<text x="712.5" y="414" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">16, 17, 20, 21</text>
</svg>
