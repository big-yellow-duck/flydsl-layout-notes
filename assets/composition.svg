<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img">
<title>Composition connects integer mappings</title><desc>A = (2,4):(4,1)    •    B = (4,2):(2,1)    •    R = A ∘ B</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="22" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">Composition connects integer mappings</text>
<text x="32" y="62" fill="#52657a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge">A = (2,4):(4,1)    •    B = (4,2):(2,1)    •    R = A ∘ B</text>
<rect x="40" y="145" width="200" height="115" rx="6" fill="#dcecff" stroke="#c9d5e3" stroke-width="1"/>
<text x="68.26953125" y="166" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">B coordinate</text>
<text x="81.40625" y="211" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">(u,v) = (2,1)</text>
<rect x="300" y="145" width="250" height="115" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="349.59375" y="166" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">B emits q = 5</text>
<text x="346.59375" y="211" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">A expands: (1,2)</text>
<rect x="610" y="145" width="300" height="115" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="660.75" y="166" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">A returns offset 6</text>
<text x="710.8359375" y="211" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">R(2,1) = 6</text>
<line x1="248" y1="202" x2="288" y2="202" stroke="#52657a" stroke-width="2"/>
<line x1="288" y1="202" x2="279" y2="196" stroke="#52657a" stroke-width="2"/>
<line x1="288" y1="202" x2="279" y2="208" stroke="#52657a" stroke-width="2"/>
<line x1="558" y1="202" x2="598" y2="202" stroke="#52657a" stroke-width="2"/>
<line x1="598" y1="202" x2="589" y2="196" stroke="#52657a" stroke-width="2"/>
<line x1="598" y1="202" x2="589" y2="208" stroke="#52657a" stroke-width="2"/>
<text x="40" y="305" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" dominant-baseline="text-before-edge">B chooses a logical position in A; A supplies its memory offset.</text>
<text x="40" y="350" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge">R(u,v) = u + 4v    →    equivalent layout (4,2):(1,4)</text>
<text x="40" y="399" fill="#52657a" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">Different shapes are fine. No values move during composition.</text>
</svg>
