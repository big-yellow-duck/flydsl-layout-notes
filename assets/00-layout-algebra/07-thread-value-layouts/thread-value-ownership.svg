<text x="262" y="239" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T1 / V0</text>
<rect x="368" y="188" width="103" height="43" fill="#ccefe6" stroke="#8294aa"/>
<text x="378" y="197" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<text x="374" y="239" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T1 / V1</text>
