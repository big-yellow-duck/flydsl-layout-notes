<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img">
<title>Two values per thread: two ways to choose their positions</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Two values per thread: two ways to choose their positions</text>
<text x="32" y="65" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">T = thread ID; V = value slot within that thread. Numbers are tile offsets.</text>
<text x="32" y="112" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="24" fill="#14253d">A. Neighbor pairs (adjacent)</text>
<text x="32" y="152" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Memory order: left to right = offsets 0 through 7</text>
<rect x="32" y="188" width="103" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="42" y="197" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<text x="38" y="239" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T0 / V0</text>
<rect x="144" y="188" width="103" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="154" y="197" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<text x="150" y="239" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">T0 / V1</text>
