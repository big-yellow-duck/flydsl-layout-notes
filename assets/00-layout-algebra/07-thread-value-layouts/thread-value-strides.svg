<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img">
<title>Read (4, 2) as (four threads, two slots per thread)</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">Read (4, 2) as (four threads, two slots per thread)</text>
<text x="32" y="65" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Shape sets the counts. Strides choose the positions assigned to those slots.</text>
<text x="32" y="118" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">A. Neighbor pairs</text>
<text x="32" y="162" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">(4, 2) : (2, 1)</text>
<text x="32" y="217" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Next thread, same slot: +2</text>
<text x="32" y="254" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Same thread, next slot: +1</text>
<text x="32" y="310" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Follow thread 2:</text>
<text x="32" y="354" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">offset(2, 0) = 2 * 2 + 0 * 1 = 4</text>
<text x="32" y="397" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">offset(2, 1) = 2 * 2 + 1 * 1 = 5</text>
<text x="490" y="118" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">B. Repeated across threads</text>
<text x="490" y="162" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">(4, 2) : (1, 4)</text>
<text x="490" y="217" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Next thread, same slot: +1</text>
<text x="490" y="254" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Same thread, next slot: +4</text>
<text x="490" y="310" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Follow thread 2:</text>
<text x="490" y="354" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">offset(2, 0) = 2 * 1 + 0 * 4 = 2</text>
<text x="490" y="397" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">offset(2, 1) = 2 * 1 + 1 * 4 = 6</text>
<text x="32" y="435" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">V0 and V1 name local slots; they do not require neighboring memory positions.</text>
</svg>
