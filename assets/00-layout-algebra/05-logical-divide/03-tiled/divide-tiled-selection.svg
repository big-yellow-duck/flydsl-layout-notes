<text x="380" y="477" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Offset = 20 + 1*8 + 2 = 30; loaded value = 130.</text>
<text x="32" y="556" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">The row stride stays 8: selecting a window does not pack or copy its values.</text>
<text x="32" y="594" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Gold marks the selected positions. All four divide variants select these same offsets.</text>
