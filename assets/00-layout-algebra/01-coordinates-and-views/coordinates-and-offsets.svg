<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img">
<title>A scalar coordinate is expanded before strides are applied</title>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">A scalar coordinate is expanded before strides are applied</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">L = (2, 4):(4, 1). The first coordinate increases fastest when expanding q.</text>
<text x="32" y="115" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">Logical scalar coordinates q</text>
<rect x="32" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="42" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<rect x="131" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="141" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<rect x="230" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="240" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="329" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="339" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">6</text>
<rect x="32" y="210" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="42" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="131" y="210" width="90" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="141" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<rect x="230" y="210" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="240" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">5</text>
<rect x="329" y="210" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="339" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="32" y="276" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Rows down; columns right. Gold = (1, 1).</text>
<text x="508" y="115" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">Memory offsets L(row, col)</text>
<rect x="508" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="518" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">0</text>
<rect x="607" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="617" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">1</text>
<rect x="706" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="716" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">2</text>
<rect x="805" y="160" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="815" y="169" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">3</text>
<rect x="508" y="210" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="518" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">4</text>
<rect x="607" y="210" width="90" height="43" fill="#ffedbe" stroke="#8294aa"/>
<text x="617" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">5</text>
<rect x="706" y="210" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="716" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">6</text>
<rect x="805" y="210" width="90" height="43" fill="#dcecff" stroke="#8294aa"/>
<text x="815" y="219" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">7</text>
<text x="508" y="276" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">Rows down; columns right. Gold = (1, 1).</text>
<rect x="32" y="326" width="220" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="338" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Scalar q = 3</text>
<text x="44" y="375" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Expand using shape</text>
<polyline points="264,370 307,370 299,365 307,370 299,375" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="320" y="326" width="270" height="87" fill="#ffedbe" stroke="#8294aa"/>
<text x="332" y="338" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Coordinate (1, 1)</text>
<text x="332" y="375" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Apply strides: 1*4 + 1</text>
<polyline points="602,370 645,370 637,365 645,370 637,375" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="658" y="326" width="270" height="87" fill="#ccefe6" stroke="#8294aa"/>
<text x="670" y="338" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Element offset = 5</text>
<text x="670" y="375" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Relative to view base</text>
<text x="32" y="454" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">For float32: address = base pointer + 5 * 4 bytes = base pointer + 20 bytes.</text>
<text x="32" y="491" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The layout computes a position. A memory view adds the storage pointer.</text>
</svg>
