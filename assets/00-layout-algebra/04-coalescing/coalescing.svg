<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
<title>Coalescing preserves the ordered offset sequence</title><desc>Merge adjacent modes only when their scalar-coordinate mapping can stay unchanged.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="22" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" dominant-baseline="text-before-edge">Coalescing preserves the ordered offset sequence</text>
<text x="32" y="62" fill="#52657a" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" dominant-baseline="text-before-edge">Merge adjacent modes only when their scalar-coordinate mapping can stay unchanged.</text>
<text x="40" y="112" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" dominant-baseline="text-before-edge">(2,4):(1,2)  →  8:1</text>
<rect x="40" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="62.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">0</text>
<rect x="105" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="127.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">1</text>
<rect x="170" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="192.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">2</text>
<rect x="235" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="257.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">3</text>
<rect x="300" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="322.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">4</text>
<rect x="365" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="387.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">5</text>
<rect x="430" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="452.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">6</text>
<rect x="495" y="158" width="58" height="48" rx="6" fill="#ccefe6" stroke="#c9d5e3" stroke-width="1"/>
<text x="517.04296875" y="170.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">7</text>
<text x="600" y="163" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" dominant-baseline="text-before-edge">Compatible: 2 = 2 × 1</text>
<text x="40" y="250" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" dominant-baseline="text-before-edge">(2,4):(4,1)  stays multi-mode</text>
<rect x="40" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="62.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">0</text>
<rect x="105" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="127.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">4</text>
<rect x="170" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="192.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">1</text>
<rect x="235" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="257.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">5</text>
<rect x="300" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="322.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">2</text>
<rect x="365" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="387.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">6</text>
<rect x="430" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="452.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">3</text>
<rect x="495" y="296" width="58" height="48" rx="6" fill="#ffedbe" stroke="#c9d5e3" stroke-width="1"/>
<text x="517.04296875" y="308.0" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" dominant-baseline="text-before-edge">7</text>
<text x="600" y="302" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" dominant-baseline="text-before-edge">No single constant stride</text>
<text x="40" y="399" fill="#14253d" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" dominant-baseline="text-before-edge">Same offset set does not mean the same mapping.</text>
</svg>
