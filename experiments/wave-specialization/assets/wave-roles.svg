<svg xmlns="http://www.w3.org/2000/svg" width="960" height="830" viewBox="0 0 960 830" role="img" aria-labelledby="title desc">
<title id="title">11 - Separate global loading from matrix computation</title>
<desc id="desc">A block uses 1 dedicated loader wave and 2 compute waves. Loaders transfer A and B into 2 LDS ring slots. Compute waves read ready slots and release them after use.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">11 - Separate global loading from matrix computation</text>
<text x="32" y="67" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">M=32, N=1024, K=8192; block 32 x 64 x 64; split_k=4.</text>
<text x="32" y="111" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">One physical block has 3 wave32 groups: 96 threads.</text>
<rect x="32" y="176" width="247" height="365" fill="#dcecff" stroke="#8294aa"/>
<text x="47" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="22" fill="#14253d">LOADER WAVES</text>
<text x="47" y="241" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Wave ID 0</text>
<text x="47" y="278" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Thread IDs 0..31</text>
<text x="47" y="337" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Global A/B loads</text>
<text x="47" y="380" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Private copy fragments</text>
<text x="47" y="423" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Write the next slot</text>
<text x="47" y="466" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">LDS stores -&gt; ready</text>
<polyline points="288,348 337,348 329,343 337,348 329,353" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="351" y="176" width="248" height="365" fill="#ccefe6" stroke="#8294aa"/>
<text x="366" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">SHARED LDS RING</text>
<rect x="368" y="243" width="214" height="72" fill="white" stroke="#8294aa"/>
<text x="380" y="255" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">slot 0: A + B</text>
<rect x="368" y="325" width="214" height="72" fill="white" stroke="#8294aa"/>
<text x="380" y="337" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">slot 1: A + B</text>
<polyline points="611,348 662,348 654,343 662,348 654,353" fill="none" stroke="#14253d" stroke-width="2"/>
<rect x="677" y="176" width="248" height="365" fill="#ffedbe" stroke="#8294aa"/>
<text x="692" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">COMPUTE WAVES</text>
<text x="692" y="241" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Wave IDs 1..2</text>
<text x="692" y="278" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Threads 32..95</text>
<text x="692" y="337" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Read the current slot</text>
<text x="692" y="380" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">LDS operand reads</text>
<text x="692" y="423" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">WMMA -&gt; FP32 sums</text>
<text x="692" y="466" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Release the read slot</text>
<text x="32" y="581" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Consumer local ID = physical thread ID - 32.</text>
<text x="32" y="624" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">Each slot: A uses 4608 bytes; B uses 8192 bytes.</text>
<rect x="32" y="673" width="893" height="87" fill="#dcecff" stroke="#8294aa"/>
<text x="44" y="685" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Global A/B loads run in loader waves; WMMA runs in compute waves</text>
<text x="44" y="722" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">The barrier schedule joins both roles after the next slot is written and the old one read.</text>
<text x="32" y="792" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Split-K finalization and BF16 output remain inside this same kernel.</text>
</svg>
