<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">11 - Loader and compute waves meet after each phase</title>
<desc id="desc">Five local K tiles use two LDS slots. Loaders publish tile zero in the prologue. Each subsequent phase loads and stores the next tile while compute waves consume the current tile. A workgroup barrier outside both role branches separates phases. The drain computes tile four without another global load.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">11 - Loader and compute waves meet after each phase</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Five local K tiles, two LDS slots; columns show dependency phases, not measured time.</text>
<text x="42" y="125" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">prologue</text>
<rect x="32" y="180" width="136" height="105" fill="#dcecff" stroke="#8294aa"/>
<text x="42" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">LOADER</text>
<text x="42" y="226" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">load tile 0</text>
<text x="42" y="257" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">write slot 0</text>
<rect x="32" y="330" width="136" height="105" fill="#ffedbe" stroke="#8294aa"/>
<text x="42" y="344" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">COMPUTE</text>
<text x="42" y="385" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">wait for tile 0</text>
<rect x="169" y="170" width="3" height="277" fill="#bdaceb" stroke="#8294aa"/>
<text x="188" y="125" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">step 0</text>
<rect x="178" y="180" width="136" height="105" fill="#dcecff" stroke="#8294aa"/>
<text x="188" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">LOADER</text>
<text x="188" y="226" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">load tile 1</text>
<text x="188" y="257" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">write slot 1</text>
<rect x="178" y="330" width="136" height="105" fill="#ffedbe" stroke="#8294aa"/>
<text x="188" y="344" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">COMPUTE</text>
<text x="188" y="377" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">WMMA tile 0</text>
<text x="188" y="407" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">read slot 0</text>
<rect x="315" y="170" width="3" height="277" fill="#bdaceb" stroke="#8294aa"/>
<text x="334" y="125" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">step 1</text>
<rect x="324" y="180" width="136" height="105" fill="#dcecff" stroke="#8294aa"/>
<text x="334" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">LOADER</text>
<text x="334" y="226" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">load tile 2</text>
<text x="334" y="257" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">write slot 0</text>
<rect x="324" y="330" width="136" height="105" fill="#ffedbe" stroke="#8294aa"/>
<text x="334" y="344" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">COMPUTE</text>
<text x="334" y="377" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">WMMA tile 1</text>
<text x="334" y="407" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">read slot 1</text>
<rect x="461" y="170" width="3" height="277" fill="#bdaceb" stroke="#8294aa"/>
<text x="480" y="125" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">step 2</text>
<rect x="470" y="180" width="136" height="105" fill="#dcecff" stroke="#8294aa"/>
<text x="480" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">LOADER</text>
<text x="480" y="226" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">load tile 3</text>
<text x="480" y="257" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">write slot 1</text>
<rect x="470" y="330" width="136" height="105" fill="#ffedbe" stroke="#8294aa"/>
<text x="480" y="344" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">COMPUTE</text>
<text x="480" y="377" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">WMMA tile 2</text>
<text x="480" y="407" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">read slot 0</text>
<rect x="607" y="170" width="3" height="277" fill="#bdaceb" stroke="#8294aa"/>
<text x="626" y="125" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">step 3</text>
<rect x="616" y="180" width="136" height="105" fill="#dcecff" stroke="#8294aa"/>
<text x="626" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">LOADER</text>
<text x="626" y="226" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">load tile 4</text>
<text x="626" y="257" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">write slot 0</text>
<rect x="616" y="330" width="136" height="105" fill="#ffedbe" stroke="#8294aa"/>
<text x="626" y="344" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">COMPUTE</text>
<text x="626" y="377" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">WMMA tile 3</text>
<text x="626" y="407" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">read slot 1</text>
<rect x="753" y="170" width="3" height="277" fill="#bdaceb" stroke="#8294aa"/>
<text x="772" y="125" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">drain</text>
<rect x="762" y="180" width="136" height="105" fill="#dcecff" stroke="#8294aa"/>
<text x="772" y="194" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">LOADER</text>
<text x="772" y="235" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">done</text>
<rect x="762" y="330" width="136" height="105" fill="#ffedbe" stroke="#8294aa"/>
<text x="772" y="344" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">COMPUTE</text>
<text x="772" y="377" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">WMMA tile 4</text>
<text x="772" y="407" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="16" fill="#14253d">read slot 0</text>
<text x="32" y="480" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Purple boundaries: LDS-only workgroup barrier, executed outside the role branch.</text>
<text x="32" y="526" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Tile 2 can overwrite slot 0 because the previous boundary completed all tile-0 reads.</text>
<text x="32" y="573" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">The final phase consumes tile 4; the loader does not fetch a nonexistent tile 5.</text>
<text x="32" y="615" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Both roles reach the same barrier instance on every steady-state iteration.</text>
</svg>
