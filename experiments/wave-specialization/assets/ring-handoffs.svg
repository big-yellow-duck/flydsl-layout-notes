<text x="32" y="431" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Gold rows trace slot 0: free targets 0, 2, 4; ready targets 1, 2, 3.</text>
<text x="32" y="478" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Semaphore mode polls these counts; barrier mode records them only for diagnostics.</text>
<text x="32" y="518" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Production barrier mode uses LDS-only workgroup barriers without counter polling.</text>
<text x="32" y="565" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Boundary trace: B=1; split 0 has A tags [1,2,4,...]; its FP32 partial is 1984.</text>
<text x="32" y="604" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Across 4 splits, the FP32 sum is 19840; convert the final result to BF16 once.</text>
</svg>
