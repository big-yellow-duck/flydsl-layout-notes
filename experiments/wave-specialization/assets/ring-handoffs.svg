<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">11 - Check the ring generations and completed readers</title>
<desc id="desc">The 2-slot example follows 5 local K tiles. Slot zero is reused three times. Ready targets count 1 loader-wave arrivals per generation; free targets count 2 compute-wave arrivals per generation.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">11 - Check the ring generations and completed readers</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="20" fill="#14253d">1 loader wave; 2 compute waves; 2 slots. Counts measure wave arrivals.</text>
<text x="32" y="108" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">generation = local_tile // slots + 1; slot = local_tile % slots</text>
<text x="32" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">tile</text>
<text x="112" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">slot</text>
<text x="200" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">generation</text>
<text x="365" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">free before write</text>
<text x="585" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">ready before read</text>
<text x="805" y="163" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="17" fill="#14253d">free after read</text>
