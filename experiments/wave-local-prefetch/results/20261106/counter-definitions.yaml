metrics:
    - name: ALUStalledByLDS
      description: 'The percentage of GPUTime ALU units are stalled by the LDS input queue being full
        or the output queue being not ready. If there are LDS bank conflicts, reduce them. Otherwise,
        try reducing the number of LDS accesses if possible. Value range: 0% (optimal) to 100% (bad).'
      properties: []
      definitions:
        - architectures:
            - gfx10
            - gfx1010
            - gfx1030
            - gfx1031
            - gfx1032
            - gfx11
            - gfx1100
            - gfx1101
            - gfx1102
            - gfx9
            - gfx906
            - gfx908
            - gfx90a
            - gfx1150
            - gfx1151
            - gfx1152
