    - name: SQ_WAVES
      description: Count number of waves sent to distributed sequencers (SQs). This value represents
        the number of waves that are sent to each SQ. This only counts new waves sent since the 
        start of collection (for dispatch profiling this is the timeframe of kernel execution, for 
        agent profiling it is the timeframe between start_context and read counter data). A sum of 
        all SQ_WAVES values will give the total number of waves started by the application during 
        the collection timeframe. Returns one value per-SE (aggregates of SIMD values).
      properties: []
      definitions:
