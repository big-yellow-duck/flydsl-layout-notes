<svg xmlns="http://www.w3.org/2000/svg" width="960" height="715" viewBox="0 0 960 715" role="img" aria-labelledby="title desc">
<title id="title">10 - Reduce cache requests while streaming the same B</title>
<desc id="desc">Separate rocprofv3 counter passes show about half as many 128-byte L1-to-L2 read requests in stage 10. External read requests remain close to the 64 MiB B input in both stages. These are counter medians rather than timed throughput.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="20" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="27" fill="#14253d">10 - Reduce cache requests while streaming the same B</text>
<text x="32" y="66" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">Same 16 x 4096 x 8192 BF16 GEMM; B occupies 64 MiB.</text>
<text x="32" y="114" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">L1 -&gt; L2: median number of 128-byte read requests per dispatch</text>
<text x="32" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Stage 09</text>
<rect x="190" y="172" width="540.0" height="52" fill="#dcecff" stroke="#8294aa"/>
<text x="752" y="186" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">1,065,282</text>
<text x="32" y="286" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Stage 10</text>
<rect x="190" y="272" width="270.2295027182956" height="52" fill="#ccefe6" stroke="#8294aa"/>
<text x="752" y="286" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">533,094</text>
<text x="32" y="380" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">L2 -&gt; external memory: median number of 128-byte read requests</text>
<text x="32" y="443" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Stage 09</text>
<rect x="190" y="433" width="267.7808823301634" height="46" fill="#dcecff" stroke="#8294aa"/>
<text x="752" y="443" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">528,263</text>
<text x="32" y="528" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="23" fill="#14253d">Stage 10</text>
<rect x="190" y="518" width="266.80483046030554" height="46" fill="#ccefe6" stroke="#8294aa"/>
<text x="752" y="528" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="21" fill="#14253d">526,338</text>
<text x="32" y="612" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="19" fill="#14253d">Read the two comparisons separately: fewer cache requests, similar external bytes.</text>
<text x="32" y="652" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Eight native dispatches per counter pass; raw CSVs and definitions accompany the lesson.</text>
<text x="32" y="687" dominant-baseline="text-before-edge" font-family="Noto Sans, sans-serif" font-size="18" fill="#14253d">Counter collection and uninstrumented timing are separate experiments.</text>
</svg>
